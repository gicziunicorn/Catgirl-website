<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./main.js" defer></script>
    <title>Nekos</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
        }
        main {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 50px;
            width: 100vw;
            height: 100vh;
            padding: 30px;
            box-sizing: border-box;
            background-color: #000000;
        }
        #image {
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            background-size: contain;
            background-position: 50%;
            background-color: #6c6c6c;
        }
    </style>
</head>
<body>
    <main>
        <nav>
            <button onClick=getImage() disabled="false">Reload</button>
        </nav>
        <div id="image"></div>
    </main>
</body>
</html>
